version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-beneficios
    restart: unless-stopped
    environment:
      POSTGRES_DB: beneficio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beneficio_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - beneficios-network

  frontend:
    build:
      context: ../frontend-angular
      dockerfile: Dockerfile
    container_name: frontend-angular
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - beneficios-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    driver: local
    name: beneficios_postgres_data

networks:
  beneficios-network:
    driver: bridge
    name: beneficios-network