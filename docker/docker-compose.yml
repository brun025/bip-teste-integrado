version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-beneficios
    restart: unless-stopped
    environment:
      POSTGRES_DB: beneficio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beneficio_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - beneficios-network

volumes:
  postgres_data:
    driver: local
    name: beneficios_postgres_data

networks:
  beneficios-network:
    driver: bridge
    name: beneficios-network