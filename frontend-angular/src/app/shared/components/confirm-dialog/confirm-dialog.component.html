<div class="dialog-container">
  <h2 class="dialog-title">{{ data.title }}</h2>

  <p class="dialog-message">{{ data.message }}</p>

  <div class="dialog-actions">
    <button
      type="button"
      class="btn btn-secondary"
      (click)="onCancel()">
      {{ data.cancelText }}
    </button>
    <button
      type="button"
      class="btn btn-danger"
      (click)="onConfirm()">
      {{ data.confirmText }}
    </button>
  </div>
</div>
